name: Actualizar contratos oficiales

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "server.js"
      - "scripts/sync-contracts.js"
      - ".github/workflows/sync-contracts.yml"

permissions:
  contents: write

jobs:
  refresh-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consultar contratos oficiales
        run: npm run sync:contracts
      - name: Publicar snapshot actualizado
        run: |
          if git diff --quiet -- contracts.json; then
            echo "Los contratos no cambiaron."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts.json
          git commit -m "Actualizar contratos oficiales"
          git push
